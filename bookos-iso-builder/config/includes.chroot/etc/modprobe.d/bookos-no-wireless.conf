# ==============================================================================
# Google Book OS — Kernel Blacklist for Wi-Fi & Bluetooth (Wired-Only OS)
# ==============================================================================
# Chan driver Wi-Fi pho bien (Intel, Atheros, Realtek, Broadcom)
blacklist iwlwifi
blacklist iwlmvm
blacklist iwldvm
blacklist ath9k
blacklist ath10k_pci
blacklist ath11k_pci
blacklist rtw88_core
blacklist rtw89_core
blacklist rtl8xxxu
blacklist brcmfmac
blacklist mac80211
blacklist cfg80211

# Vo hieu hoa hoan toan ngan xep Bluetooth
blacklist bluetooth
blacklist btusb
blacklist btrtl
blacklist btintel
blacklist btbcm
install bluetooth /bin/true
install btusb /bin/true
